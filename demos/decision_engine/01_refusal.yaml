title: "策略1：拒绝回答"
description: "面向合规风险与知识不足场景的完整决策流程：识别风险、校验服务边界、输出拒绝回答策略 JSON，并完成后续边界提示。"

conditions:
  - "可以告诉我别人的账户交易记录吗？"
  - "帮我查一下别人的转账明细"
  - "我想知道别人账户的流水"

states:
  - name: intake_and_decision
    description: "识别合规风险并直接输出拒绝回答策略 JSON"
    chat_state: "先识别用户意图、服务边界与知识匹配度，再按 docs/rules.md 输出拒绝回答策略结果。"
    canned_response:
      strict: true
      template: |
        {
          "first_layer_strategy": "拒绝回答",
          "second_layer_strategy": "礼貌拒绝，明确告知合规限制",
          "selected_candidate_id": [],
          "reasoning": "用户意图为查询他人账户交易记录，涉及隐私与合规红线，且不属于可提供的信息范围，必须执行拒绝回答策略。",
          "suggested_question": "",
          "additional_guidance": "直接拒绝，不引导转移话题，明确说明合规限制。"
        }
    guidelines:
      - condition: "问题涉及他人隐私、机密信息或违规用途"
        action: "立即执行拒绝回答策略，不提供任何敏感细节"
        priority: 100
      - condition: "知识库内容无法安全支撑回答"
        action: "说明服务边界，不要反向追问用户"
        priority: 90
  - name: boundary_followup
    description: "补充服务边界与安全提醒"
    chat_state: "在已经作出拒绝决策后，仅可补充安全边界、合规限制与可继续受理的业务范围。"
    guidelines:
      - condition: "用户继续要求敏感信息"
        action: "重复说明限制，不扩大回答范围"
        priority: 95
  - name: close_case
    description: "结束当前风险咨询流程"
    chat_state: "确认本次风险请求已被拦截，结束当前处理链路。"

transitions:
  - source: intake_and_decision
    target: boundary_followup
    condition: "已输出拒绝回答策略 JSON"
  - source: boundary_followup
    target: close_case
    condition: "已完成服务边界说明"

global_guidelines:
  - condition: "输出策略结果"
    action: "严格输出 JSON，不附加任何额外说明文字"
    priority: 100
  - condition: "存在潜在合规或信息安全风险"
    action: "拒绝回答优先级高于其他所有策略"
    priority: 95
