title: "策略4：直接作答"
description: "面向知识充分、问题清晰场景的完整流程：确认问题范围、选择高度相关知识、输出直接作答策略 JSON，并补充结构化答复要点。"

conditions:
  - "哪一种办理速度最快？"
  - "线下、邮寄和线上开户哪个最快"
  - "请直接告诉我最快的开户方式"

states:
  - name: intake_and_decision
    description: "确认知识充足并输出直接作答策略 JSON"
    chat_state: "先确认用户问题是否清晰、知识是否完整，再按 docs/rules.md 输出直接作答策略。"
    canned_response:
      strict: true
      template: |
        {
          "first_layer_strategy": "直接作答",
          "second_layer_strategy": "常规问题完整解答",
          "selected_candidate_id": ["k1", "k2", "k3"],
          "reasoning": "用户正在比较线下、邮寄、线上三种开户渠道的办理时效，问题清晰且知识信息完整，可直接结构化作答。",
          "suggested_question": "",
          "additional_guidance": "同步告知线下与线上最快 3 个工作日可获得关键结果，邮寄渠道约 1 周收到申请表。"
        }
    guidelines:
      - condition: "用户问题清晰且已有完整知识支持"
        action: "直接作答，并按逻辑顺序组织结构化信息"
        priority: 100
      - condition: "用户询问办理时效对比"
        action: "列出线下、邮寄、线上三类渠道并指出最快选项"
        priority: 90
  - name: structure_answer
    description: "整理多知识点输出结构"
    chat_state: "在直接作答后，应继续保持答案结构化，避免遗漏多项信息。"
  - name: answer_followup
    description: "补充推荐与注意事项"
    chat_state: "根据已输出的结论补充必要的比较说明与下一步建议。"

transitions:
  - source: intake_and_decision
    target: structure_answer
    condition: "已完成直接作答策略判定"
  - source: structure_answer
    target: answer_followup
    condition: "已完成结构化答案整理"

global_guidelines:
  - condition: "输出策略结果"
    action: "严格输出 JSON，不附加任何额外说明文字"
    priority: 100
  - condition: "选用直接作答策略"
    action: "仅引用高度相关知识，不得扩展到无关业务"
    priority: 95
