title: "策略7：问题已解决"
description: "面向办结与自然收尾场景的完整流程：确认问题已解决、补充可继续协助提示、礼貌结束会话。"

conditions:
  - "没有其他问题了，谢谢！"
  - "好的，问题解决了"
  - "谢谢你，已经可以了"

states:
  - name: intake_and_decision
    description: "识别办结信号并输出问题已解决策略 JSON"
    chat_state: "结合 intent_status 与用户话术判断是否可以进入办结收尾流程。"
    canned_response:
      strict: true
      template: |
        {
          "first_layer_strategy": "问题已解决",
          "second_layer_strategy": "用户表达感谢",
          "selected_candidate_id": [],
          "reasoning": "用户明确表示没有其他问题并表达感谢，说明当前咨询目标已达成，可按办结收尾策略结束对话。",
          "suggested_question": "",
          "additional_guidance": "简洁致谢，告知如有其他问题可继续咨询，自然结束对话。"
        }
    guidelines:
      - condition: "用户明确表示问题已解决、没有其他问题或表达感谢"
        action: "切换到办结收尾流程，不再追加无关追问"
        priority: 100
      - condition: "当前咨询目标已达成"
        action: "简洁总结并礼貌结束"
        priority: 90
  - name: confirm_resolution
    description: "确认需求已满足"
    chat_state: "在办结前简要确认用户当前需求已满足。"
  - name: polite_closing
    description: "礼貌收尾并结束会话"
    chat_state: "完成确认后，礼貌道别并关闭当前服务流程。"

transitions:
  - source: intake_and_decision
    target: confirm_resolution
    condition: "已识别问题办结信号"
  - source: confirm_resolution
    target: polite_closing
    condition: "已确认用户需求满足"

global_guidelines:
  - condition: "输出策略结果"
    action: "严格输出 JSON，不附加任何额外说明文字"
    priority: 100
  - condition: "进入问题已解决策略"
    action: "保持收尾简洁自然，同时提示仍可继续提供帮助"
    priority: 95
