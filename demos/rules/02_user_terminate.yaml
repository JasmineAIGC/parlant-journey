title: "策略2：用户主动终止咨询"
description: "docs/rules.md 中的用户主动终止咨询策略代表场景：用户明确表示结束当前咨询。"

conditions:
  - "我先不办了，就这样吧"

states:
  - name: terminate_decision
    description: "输出用户主动终止咨询策略 JSON"
    chat_state: "当前仅处理 docs/rules.md 中的用户主动终止咨询策略。"
    canned_response:
      strict: true
      template: |
        {
          "first_layer_strategy": "用户主动终止咨询",
          "second_layer_strategy": "用户主动提出结束",
          "selected_candidate_id": [],
          "reasoning": "用户明确表示不再继续办理并结束咨询，应尊重用户意愿，执行终止咨询策略。",
          "suggested_question": "",
          "additional_guidance": "确认终止意愿，礼貌询问是否还有其他需求。"
        }
    guidelines:
      - condition: "用户明确表示结束当前咨询"
        action: "优先结束当前办理，尊重用户意愿"
        priority: 95
      - condition: "对话可自然收尾"
        action: "礼貌询问是否还有其他问题"
        priority: 80

global_guidelines:
  - condition: "输出策略结果"
    action: "严格输出 JSON，不附加额外说明"
    priority: 100
