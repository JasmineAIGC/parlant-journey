title: "策略4：直接作答"
description: "docs/rules.md 中的直接作答策略代表场景：比较三种开户渠道的办理时效。"

conditions:
  - "哪一种办理速度最快？"

states:
  - name: direct_answer_decision
    description: "输出直接作答策略 JSON"
    chat_state: "当前仅处理 docs/rules.md 中的直接作答策略。"
    canned_response:
      strict: true
      template: |
        {
          "first_layer_strategy": "直接作答",
          "second_layer_strategy": "常规问题完整解答",
          "selected_candidate_id": ["k1", "k2", "k3"],
          "reasoning": "用户正在比较线下、邮寄、线上三种开户渠道的办理时效，问题清晰且知识信息完整，可直接结构化作答。",
          "suggested_question": "",
          "additional_guidance": "同步告知线下与线上最快 3 个工作日可获得关键结果，邮寄渠道约 1 周收到申请表。"
        }
    guidelines:
      - condition: "用户问题清晰且已有完整知识支持"
        action: "直接作答，并按结构化方式比较不同选项"
        priority: 95
      - condition: "用户询问办理时效对比"
        action: "同时列出线下、邮寄、线上三类渠道并给出最快选项"
        priority: 85

global_guidelines:
  - condition: "输出策略结果"
    action: "严格输出 JSON，不附加额外说明"
    priority: 100
