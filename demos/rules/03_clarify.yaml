title: "策略3：确认/追问"
description: "docs/rules.md 中的确认/追问策略代表场景：用户咨询开户条件，但关键信息缺失。"

conditions:
  - "我想了解开户条件"

states:
  - name: clarify_decision
    description: "输出确认/追问策略 JSON"
    chat_state: "当前仅处理 docs/rules.md 中的确认/追问策略。"
    canned_response:
      strict: true
      template: |
        {
          "first_layer_strategy": "确认/追问",
          "second_layer_strategy": "核实具体业务关键信息",
          "selected_candidate_id": [],
          "reasoning": "用户意图为咨询开户资质，但国籍等关键信息缺失，必须先补充必要信息后才能继续作答。",
          "suggested_question": "请问您是日本国籍吗？",
          "additional_guidance": "单次只追问一个问题，不要同时提出多个问题。"
        }
    guidelines:
      - condition: "用户核心意图明确，但办理所需关键信息缺失"
        action: "只追问一个最高优先级的问题"
        priority: 95
      - condition: "用户为开户资质类咨询"
        action: "优先核实国籍、年龄、办理网点等关键字段"
        priority: 85

global_guidelines:
  - condition: "输出策略结果"
    action: "严格输出 JSON，不附加额外说明"
    priority: 100
