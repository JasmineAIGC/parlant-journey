title: "策略1：拒绝回答"
description: "docs/rules.md 中的拒绝回答策略代表场景：合规禁止类问题。"

conditions:
  - "可以告诉我别人的账户交易记录吗？"

states:
  - name: refusal_decision
    description: "输出拒绝回答策略 JSON"
    chat_state: "当前仅处理 docs/rules.md 中的拒绝回答策略。"
    canned_response:
      strict: true
      template: |
        {
          "first_layer_strategy": "拒绝回答",
          "second_layer_strategy": "礼貌拒绝，明确告知合规限制",
          "selected_candidate_id": [],
          "reasoning": "用户意图为查询他人账户交易记录，涉及隐私与合规红线，必须执行拒绝回答策略。",
          "suggested_question": "",
          "additional_guidance": "直接拒绝，不引导转移话题，明确说明合规限制。"
        }
    guidelines:
      - condition: "用户问题涉及他人隐私、机密信息或合规红线"
        action: "礼貌拒绝，明确划定服务边界"
        priority: 95
      - condition: "现有知识或权限不足以安全作答"
        action: "不要追问，不要延伸解释"
        priority: 85

global_guidelines:
  - condition: "输出策略结果"
    action: "严格输出 JSON，不附加额外说明"
    priority: 100
