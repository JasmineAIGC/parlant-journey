[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "parlant-journey"
version = "0.1.0"
description = "Declarative Journey builder for Parlant"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["parlant", "journey", "conversational-ai", "chatbot"]
dependencies = [
    "parlant",
]

[project.optional-dependencies]
yaml = [
    "pyyaml",
]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["[0-9][0-9]_test_*.py", "test_*.py", "*_test.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["journey*", "tools*"]
